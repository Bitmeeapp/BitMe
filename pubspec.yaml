name: bitme
description: Chat without internet over Bluetooth or WiFi.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  nearby_connections: ^4.2.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.5
  share_plus: ^10.1.4
  android_intent_plus: ^5.2.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/donate_qr.png
