      - name: Sign release build with the stable key
        run: |
          python3 - <<'PY'
          import glob, re
          kts = "\n".join([
              '    signingConfigs {',
              '        create("bitme") {',
              '            storeFile = file(System.getProperty("user.home") + "/.android/debug.keystore")',
              '            storePassword = "android"',
              '            keyAlias = "androiddebugkey"',
              '            keyPassword = "android"',
              '        }',
              '    }', '', ''])
          groovy = "\n".join([
              '    signingConfigs {',
              '        bitme {',
              '            storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")',
              '            storePassword "android"',
              '            keyAlias "androiddebugkey"',
              '            keyPassword "android"',
              '        }',
              '    }', '', ''])
          done = False
          for g in glob.glob("android/app/build.gradle*"):
              t = open(g).read()
              if g.endswith(".kts"):
                  block = kts
                  t2 = t.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("bitme")')
              else:
                  block = groovy
                  t2 = t.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.bitme")
              if t2 != t:
                  t2 = re.sub(r"^(\s*)buildTypes\s*\{", lambda m: block + m.group(0), t2, count=1, flags=re.M)
                  open(g, "w").write(t2)
                  done = True
                  print("signing patched:", g)
          print("OK" if done else "WARNING: signing patch not applied")
          PY
      - name: Android extras (notification permission, desugaring)
        run: |
          python3 - <<'PY'
          import glob, re
          man = "android/app/src/main/AndroidManifest.xml"
          s = open(man).read()
          if "POST_NOTIFICATIONS" not in s:
              s = s.replace("<application", '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application', 1)
              open(man, "w").write(s)
              print("manifest: added POST_NOTIFICATIONS")
          for g in glob.glob("android/app/build.gradle*"):
              t = open(g).read()
              if g.endswith(".kts"):
                  if "isCoreLibraryDesugaringEnabled" not in t:
                      t = re.sub(r"(compileOptions\s*\{)", r"\1\n        isCoreLibraryDesugaringEnabled = true", t, count=1)
                      t += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n'
                      print("desugaring enabled in", g)
              else:
                  if "coreLibraryDesugaringEnabled" not in t:
                      t = re.sub(r"(compileOptions\s*\{)", r"\1\n        coreLibraryDesugaringEnabled true", t, count=1)
                      t += '\ndependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"\n}\n'
                      print("desugaring enabled in", g)
              open(g, "w").write(t)
          PY
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=BUILD=${{ github.run_number }}
      - name: Verify APK is signed with the stable key
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          SIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner 2>/dev/null | tail -1)
          if [ -z "$SIGNER" ]; then echo "apksigner not found, skipping check"; exit 0; fi
          A=$("$SIGNER" verify --print-certs "$APK" | grep -i 'SHA-256 digest' | head -1 | awk '{print $NF}' | tr 'A-F' 'a-f')
          K=$(keytool -list -keystore ~/.android/debug.keystore -storepass android | grep -i 'SHA-256' | head -1 | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f')
          echo "APK signing key : $A"
          echo "Stable key      : $K"
          if [ -n "$A" ] && [ -n "$K" ] && [ "$A" != "$K" ]; then
            echo "::error::APK is NOT signed with the stable key (updates would need uninstall)"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Bitme-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Bitme 1.0.${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
