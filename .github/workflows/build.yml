name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Dart files are complete and up to date
        run: |
          for f in lib/*.dart; do
            if ! tail -n 1 "$f" | grep -q '^// EOF'; then
              echo "::error::$f is incomplete (cut off while uploading). Upload it again."
              exit 1
            fi
          done
          BAD=0
          need() {
            if ! grep -q "$2" "lib/$1"; then
              echo "::error::lib/$1 is an OLD version (missing: $2). Upload the newest $1 into the lib folder."
              BAD=1
            fi
          }
          need transport.dart "bool meshEnabled"
          need bt_transport.dart "class BtTransport"
          need shell.dart "_setMesh"
          need shell_parts.dart "Mesh relay"
          need chat.dart "isMesh"
          need chat.dart "IntrinsicWidth"
          need shell_parts.dart "SingleChildScrollView"
          need ui.dart "ImageProvider"
          need shell.dart "_pickAvatar"
          need shell_actions.dart "_plusMenu"
          need shell_actions.dart "_editProfile"
          need store.dart "class ChatStore"
          need transport.dart "class PeerProfile"
          need shell_actions.dart "_initNotifications"
          need chat.dart "markRead"
          need bt_transport.dart "_sendProfile"
          need shell.dart "_setProfile"
          need shell_parts.dart "Edit Profile"
          for dep in flutter_local_notifications image_picker android_intent_plus share_plus url_launcher permission_handler nearby_connections shared_preferences; do
            if ! grep -q "^  $dep:" pubspec.yaml; then
              echo "::error::pubspec.yaml is an OLD version (missing: $dep). Upload the newest pubspec.yaml (project root)."
              BAD=1
            fi
          done
          for asset in assets/icon.png assets/donate_qr.png; do
            if [ ! -f "$asset" ]; then
              echo "::error::$asset is missing from the repo. Upload it into the assets folder."
              BAD=1
            fi
          done
          if grep -q "class BtTransport" lib/transport.dart; then
            echo "::error::lib/transport.dart is an OLD version (it still contains BtTransport). Upload the newest transport.dart."
            BAD=1
          fi
          if [ "$BAD" = "1" ]; then exit 1; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Android scaffold
        run: |
          flutter create --platforms=android --project-name bitme --org com.bitme /tmp/scaffold
          cp -r /tmp/scaffold/android ./android
          python3 tools/patch_android.py
